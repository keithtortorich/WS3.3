version: "3.9"

# Full local dev stack for the Social Media Marketing Machine.
# Copy .env.example to .env before running `docker compose up --build`.

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me-to-a-random-64-char-string}
  APP_HOST: ${APP_HOST:-0.0.0.0}
  APP_PORT: ${APP_PORT:-8000}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_USER: ${POSTGRES_USER:-smm_admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smm_dev_password}
  POSTGRES_DB: ${POSTGRES_DB:-smm_platform}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smm_admin}:${POSTGRES_PASSWORD:-smm_dev_password}@postgres:5432/${POSTGRES_DB:-smm_platform}
  DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-smm_admin}:${POSTGRES_PASSWORD:-smm_dev_password}@postgres:5432/${POSTGRES_DB:-smm_platform}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-smm_minio_admin}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-smm_minio_password}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-smm-media}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_USE_SSL: ${S3_USE_SSL:-false}
  S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE:-http://localhost:9000/smm-media}
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_replace_me}
  CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-pk_test_replace_me}
  CLERK_JWKS_URL: ${CLERK_JWKS_URL:-https://your-instance.clerk.accounts.dev/.well-known/jwks.json}
  CLERK_ISSUER: ${CLERK_ISSUER:-https://your-instance.clerk.accounts.dev}
  CLERK_AUDIENCE: ${CLERK_AUDIENCE:-}
  AI_PROVIDER: ${AI_PROVIDER:-ollama}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3.1}
  OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
  LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-replace_me}
  LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-replace_me}
  LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-http://localhost:8000/api/v1/auth/linkedin/callback}
  LINKEDIN_API_VERSION: ${LINKEDIN_API_VERSION:-202405}
  CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-false}
  CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
  PUBLISH_RETRY_MAX_ATTEMPTS: ${PUBLISH_RETRY_MAX_ATTEMPTS:-5}
  PUBLISH_RETRY_BACKOFF_BASE_SECONDS: ${PUBLISH_RETRY_BACKOFF_BASE_SECONDS:-30}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-smm_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smm_admin} -d ${POSTGRES_DB:-smm_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smm_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smm_network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-smm_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-smm_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smm_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - smm_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smm_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_replace_me}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_replace_me}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - smm_network

networks:
  smm_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
