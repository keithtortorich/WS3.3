[project]
name = "webstaffr"
version = "3.3.0"
description = "WebStaffr local service business platform"
requires-python = ">=3.10"
dependencies = [
    "anyio==4.12.1",
    "certifi==2026.6.17",
    "click==8.1.8",
    "fastapi==0.128.8",
    "h11==0.16.0",
    "httpx==0.28.1",
    "idna==3.18",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
    "pydantic_core==2.46.4",
    "starlette==0.49.3",
    "uvicorn==0.39.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
